name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: actions/configure-pages@v6
      - run: node scripts/build_web.mjs
      # v4 stopped including dotfiles in the artifact, and build_web.mjs writes a
      # .nojekyll into web/dist. Deployment would have kept working and the file
      # would simply have stopped being there -- the kind of silent drop that is
      # found months later, so ask for it explicitly.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@v5
