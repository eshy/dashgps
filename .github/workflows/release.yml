name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write

jobs:
  gate:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: gate
    runs-on: ubuntu-latest
    # PyPI Trusted Publishing is scoped to this environment: configure it once on PyPI and no
    # long-lived API token ever has to exist.
    environment:
      name: release
      url: https://pypi.org/p/dashgps
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm trusted publishing needs a recent CLI
        # setup-node ships whatever npm was bundled with the Node release; OIDC publishing needs
        # npm >= 11.5.1, which Node 22's bundled npm predates.
        run: npm install -g npm@latest && npm --version

      - name: Tag must match VERSION
        run: |
          want=$(cat VERSION)
          got=${GITHUB_REF_NAME#v}
          [ "$want" = "$got" ] || { echo "tag $got != VERSION $want"; exit 1; }

      - name: Build the Python distribution
        run: |
          python -m pip install --upgrade build
          python -m build python/ --outdir dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # Re-running a release must not hard-fail on a version that already went out.
          skip-existing: true

      # No NODE_AUTH_TOKEN: npm trusted publishing authenticates with the OIDC token minted by
      # `id-token: write`. Configure the publisher at npmjs.com/package/dashgps/access.
      #
      # NOTE: npm cannot publish a package's FIRST version over OIDC — a trusted publisher can
      # only be configured on a package that already exists (npm/cli#8544). Version 0.1.0 is
      # therefore published by hand, once; every release after it comes through here.
      - name: Has this version already been published to npm?
        id: npmcheck
        working-directory: js
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "dashgps@$v" version >/dev/null 2>&1; then
            echo "npm already has dashgps@$v; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.npmcheck.outputs.skip == 'false'
        working-directory: js
        # --provenance is documented as implicit under trusted publishing, but is still required
        # in practice; it is harmless either way.
        run: npm publish --provenance --access public

      - name: Attach the fixtures so reimplementations can self-test
        run: tar czf fixtures.tar.gz fixtures/

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            fixtures.tar.gz
            dist/*
