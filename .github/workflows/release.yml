name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write

jobs:
  gate:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Tag must match VERSION
        run: |
          want=$(cat VERSION)
          got=${GITHUB_REF_NAME#v}
          [ "$want" = "$got" ] || { echo "tag $got != VERSION $want"; exit 1; }

      - name: Build the Python distribution
        run: |
          python -m pip install --upgrade build
          python -m build python/ --outdir dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: Publish to npm
        working-directory: js
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Attach the fixtures so reimplementations can self-test
        run: tar czf fixtures.tar.gz fixtures/

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            fixtures.tar.gz
            dist/*
