name: ci
on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs this whole gate before publishing anything.
  workflow_call:
permissions:
  contents: read

jobs:
  fixtures:
    name: fixtures are deterministic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Regenerate and diff
        run: |
          python3 fixtures/build_fixtures.py
          git diff --exit-code fixtures/bin fixtures/cases fixtures/manifest.json

  guards:
    name: determinism and version guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: python3 scripts/check_determinism.py --self-test
      - run: python3 scripts/check_version.py
      - run: python3 scripts/check_packaging.py --self-test

  package:
    name: the distributions actually build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Build and validate the Python distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build python/ --outdir dist/
          twine check --strict dist/*
      - name: Install the wheel and run the console script
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/dashgps --version
          /tmp/venv/bin/dashgps formats
          /tmp/venv/bin/dashgps fixtures/bin/ligo_ts_trailer_basic.ts -o /tmp/pkgout --group none -q
          diff /tmp/pkgout/all.csv fixtures/golden/ligo_ts_trailer_basic/all.csv
          echo "the installed package reproduces the golden output"
      - name: Pack the npm tarball and run its bin
        working-directory: js
        run: |
          npm pack --dry-run
          npm pack
          npm install -g ./dashgps-*.tgz
          dashgps --version
          cd .. && dashgps fixtures/bin/ligo_ts_trailer_basic.ts -o /tmp/npmout --group none -q
          diff /tmp/npmout/all.csv fixtures/golden/ligo_ts_trailer_basic/all.csv
          echo "the installed npm package reproduces the golden output"

  python:
    name: python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ matrix.python }}" }
      - name: Run the test suite
        working-directory: python/tests
        run: python -m unittest discover -s .

  js:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "${{ matrix.node }}" }
      - name: Run the test suite
        working-directory: js
        # No glob. PowerShell is the default shell on windows-latest and does not
        # expand one for a native command, so Node received the literal string
        # `test/*.test.js`. Node 22 globs test paths itself and shrugged it off;
        # Node 20 does not, which is why exactly one job in the matrix failed.
        # With no path at all the runner discovers the files itself, on every
        # shell and every supported Node.
        run: node --test

  parity:
    name: python and javascript agree byte-for-byte
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: ./scripts/parity.sh

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      # Pinned deliberately. An unpinned `pipx install ruff` made every build a
      # bet on that morning's release: 0.16 widened the default rule set and
      # turned the lint job red on code nobody had touched. Raise this together
      # with the `dev` extra in python/pyproject.toml, in a commit that carries
      # whatever fixes the new rules ask for.
      - run: pipx install ruff==0.16.6
      - run: ruff check python/ fixtures/ scripts/
      - name: No tracked file may contain a CR
        run: |
          # .gitattributes says `* -text`, so nothing is translated on checkout
          # and a CR in the working tree means a CR is committed. That would
          # break the byte-for-byte goldens on every other platform, which is
          # how five windows-latest jobs failed before .gitattributes existed.
          if git grep -I -l $'\r' -- . ; then
            echo "the files above contain carriage returns; commit them with LF endings"
            exit 1
          fi
          echo "no tracked file contains a CR"
      - name: Syntax-check every JS module
        run: |
          for f in $(find js/src js/bin web -name '*.js'); do node --check "$f"; done

  web:
    name: web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: node scripts/build_web.mjs
      - name: The single-file build must be self-contained
        run: |
          test -f web/dist/dashgps-standalone.html
          if grep -qE '<script[^>]+src=|<link[^>]+stylesheet[^>]+href="\./' \
              web/dist/dashgps-standalone.html; then
            echo "standalone build still references an external file"; exit 1
          fi
          echo "standalone build is one file"
      - name: The deployed bundle must not import node builtins
        run: |
          if grep -rn "node:" web/dist/lib web/dist/*.js; then
            echo "web/dist imports a node builtin; it would fail in a browser"; exit 1
          fi
          echo "web/dist is browser-safe"
