[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dashgps"
version = "0.1.0"
description = "Extract GPS tracks from dashcam video files. No dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "dashgps contributors" }]
keywords = ["dashcam", "gps", "gpx", "geojson", "mpeg-ts", "ligogps", "nmea", "telemetry"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/eshy/dashgps"
Documentation = "https://github.com/eshy/dashgps/tree/main/spec"
Issues = "https://github.com/eshy/dashgps/issues"

[project.scripts]
dashgps = "dashgps.cli:main"

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/dashgps"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E203", "E741"]
